version: "3.9"
services:
  mongo:
    image: mongo:6
    container_name: smart-survey-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: smart-survey-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/smart_survey
      - JWT_SECRET=devsecret
      - CORS_ORIGINS=*
  
  frontend:
    build: ./frontend
    container_name: smart-survey-frontend
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    depends_on:
      - backend
    environment:
      - API_URL=http://host.docker.internal:5000  # For local dev

volumes:
  mongo-data:
